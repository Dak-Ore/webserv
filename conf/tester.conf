server {
    listen 127.0.0.1:8080;
    server_name localhost www.localhost;

    location / {
        allow_methods GET;
    }

    location /put_test/ {
        root /var/www/images;
        upload_path /upload;
        upload_enabled on;
        allow_methods GET POST;
    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    location /*.bla {
        allow_methods POST;
        fastcgi_pass unix:/var/run/cgi_test.sock;
        fastcgi_param SCRIPT_FILENAME /path/to/cgi_test;
        include fastcgi_params; 
    }

    location /directory/ {
        allow_methods GET POST;
        root YoupiBanane;
        index youpi.bad_extension;
    }
}
