server {
    listen 127.0.0.1:8080;
    server_name localhost www.localhost;
    root www;
    index index.htm index.html;
    client_max_body_size 100k;

    error_page 404 www/errors/404.html;
    error_page 500 www/errors/500.html;
    location / {
        root www;
        index index.html;
        autoindex off;
        allow_methods GET POST;
    }
}