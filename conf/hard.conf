server {
    listen localhost:8080;
    listen 127.0.0.1:8081;
    server_name localhost www.localhost;
    root www;
    index index.htm index.html;
    client_max_body_size 100k;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        root /var/www/html;
        index index.html;
        autoindex off;
        allow_methods GET POST;
        try_files $uri $uri/ /index.html;
    }

    location /images/ {
        root /var/www/images;
        autoindex on;
        allow_methods GET;
        try_files $uri =404;
    }

    location /redirect-me {
        return 301 http://example.com;
    }

    location /upload {
        root /var/www/uploads;
        upload_path /var/uploads;
        upload_enabled on;
        allow_methods POST;
    }

    location /cgi-bin/ {
        root /var/www/cgi-bin;
        cgi_extension .php;
        allow_methods GET POST;
        try_files $uri =404;
    }

    location /test_block_1 {
        root /var/www/test;
        index test.html;
        autoindex on;
        allow_methods GET POST;
        try_files $uri /test.html;
    }

    location /test_block_2 {
        root /var/www/test2;
        index test2.html;
        allow_methods GET;
        try_files $uri /test2.html;
    }

    location /user_data/ {
        root /var/www/users;
        autoindex off;
        allow_methods GET POST;
    }

    location /special_block {
        root /var/www/special;
        index special.html;
        allow_methods GET;
    }

    location /error_test {
        root /var/www/html;
        error_page 404 /errors/custom_404.html;
    }

    location /large_upload {
        root /var/www/large_uploads;
        upload_path /var/large_uploads;
        upload_enabled on;
        allow_methods POST;
        client_max_body_size 50M;
    }

    location /block_with_conditions {
        return 200 http://example.com;
    }

    location /rewrite_test {
        rewrite ^/old-url$ /new-url permanent;
    }

    location /auth_block {
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location /gzip_test {
        gzip on;
        gzip_types text/plain application/javascript;
        gzip_min_length 1000;
    }
}

server {
    listen 127.0.0.1:8511;
    listen 127.0.0.1:8481;
    server_name localhost www.localhost;
    root www;
    index index.htm index.html;
    client_max_body_size 100k;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        root /var/www/html;
        index index.html;
        autoindex off;
        allow_methods GET POST;
        try_files $uri $uri/ /index.html;
    }

    location /images/ {
        root /var/www/images;
        autoindex on;
        allow_methods GET;
        try_files $uri =404;
    }

    location /redirect-me {
        return 301 http://example.com;
    }

    location /upload {
        root /var/www/uploads;
        upload_path /var/uploads;
        upload_enabled on;
        allow_methods POST;
    }

    location /cgi-bin/ {
        root /var/www/cgi-bin;
        cgi_extension .php;
        allow_methods GET POST;
    }

    location /new_test_block {
        root /var/www/new_test;
        index new_test.html;
        allow_methods GET;
        try_files $uri /new_test.html;
    }

    location /with_cache {
        root /var/www/cache;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /debug_block {
        set $debug_value "true";
        return 200 http://example.com;
    }

    location /blocking_methods {
        return 403 http://example.com;
    }

    location /logging_test {
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
        return 200 http://example.com;
    }

    location /multi_test {
        return 200 http://example.com;
    }

    location /complex_block {
        return 404 http://example.com;
    }
}
