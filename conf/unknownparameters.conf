server {
    listen 127.0.0.1:8080;
    server_name localhost www.localhost;
    root www;
    index index.htm index.html;
    client_max_body_size 100k;
    upload_enabled on;

    error_page 404 www/errors/404.html;
    error_page 500 www/errors/500.html;

    unknown_parameter1 hoi;
    unknown_parameter2 hee;
    location / {
        root www;
        index index.html;
        autoindex off;
        allow_methods GET POST;

        unknown_parameter1 hoi;
        unknown_parameter3 haa;

        cgi .php {
            binary /bin/php-cgi;
            pass_script_through_argv false;

            unknown_parameter1 hoi;
            unknown_parameter4 hoo;
        }
    }
}
