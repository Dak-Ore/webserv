# Premier serveur
server {
    listen 127.0.0.1:8080;
    server_name localhost www.localhost;
    root www;
    index index.htm index.html;
    client_max_body_size 100k;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
    location / {
        root www;
        index index.html;
        autoindex off;
        allow_methods GET POST;
    }

    location /images/{
        root var/www/images;
        autoindex on;
        allow_methods GET;
    }

    location /redirect-me {
        return 301 http://example.com;
    }

    location /upload {
        root var/www/uploads;
        upload_path /var/uploads;
        upload_enabled on;
        allow_methods POST;
    }

    location /cgi/ {
        root www/cgi;
        index index.php;
        cgi .php {
            binary /bin/php-cgi;
            pass_script_through_argv false;
        }
        allow_methods GET POST;
    }
}

# Deuxième serveur
server {
    listen 0.0.0.0:8080;
    server_name api.mysite.com;
    root www;
    index index.py;
    client_max_body_size 500000;

    error_page 404 /errors/api-404.html;

    location / {
        root var/www/api;
        index index.py;
        allow_methods GET POST;
    }

    location /docs {
        root var/www/api/docs;
        autoindex on;
        allow_methods GET;
    }
}
